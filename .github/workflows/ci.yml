name: Java Calculator CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Test and Create JAR
        run: mvn --batch-mode clean verify

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: calculator-jar
          path: target/*.jar
          if-no-files-found: error