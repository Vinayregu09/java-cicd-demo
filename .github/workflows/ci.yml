name: Excuse Pipeline (Java)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and run tests
        run: mvn -B verify

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: excuse-generator-jar
          path: target/*.jar

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download the jar
        uses: actions/download-artifact@v4
        with:
          name: excuse-generator-jar

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: "Deploy to production (pretend)"
        run: |
          echo "Deploying excuses to 8 billion developers..."
          java -jar excuse-generator-1.0.0.jar
          echo "Deployed! Nobody panic."